<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Ballerina Wasm IDE</title>
  <script src="wasm_exec.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: #222;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    main {
      display: flex;
      flex: 1;
      overflow: hidden;
      border-top: 1px solid #444;
    }

    #sidebar {
      width: 250px;
      background: #2d2d2d;
      color: #ccc;
      border-right: 1px solid #444;
      display: flex;
      flex-direction: column;
    }

    #file-tree {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    #editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #1e1e1e;
    }

    #editor {
      flex: 1;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 14px;
      border: none;
      padding: 10px;
      resize: none;
      outline: none;
    }

    #tabs {
      display: flex;
      background: #252526;
      border-bottom: 1px solid #333;
      height: 35px;
    }

    .tab {
      padding: 8px 15px;
      color: #969696;
      cursor: pointer;
      border-right: 1px solid #333;
      font-size: 13px;
      display: flex;
      align-items: center;
    }

    .tab.active {
      background: #1e1e1e;
      color: white;
    }

    .tree-item {
      cursor: pointer;
      padding: 3px 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tree-item:hover {
      background: #37373d;
    }

    .tree-folder {
      font-weight: bold;
      color: #eee;
    }

    .tree-file {
      padding-left: 20px;
    }

    .tree-item.selected {
      background: #094771;
      color: white;
    }

    #output-panel {
      height: 200px;
      background: #1e1e1e;
      color: #ccc;
      border-top: 2px solid #333;
      padding: 10px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }

    button {
      background: #007acc;
      color: white;
      border: none;
      padding: 5px 15px;
      cursor: pointer;
      border-radius: 2px;
    }

    button:disabled {
      background: #444;
      cursor: not-allowed;
    }

    button:hover:not(:disabled) {
      background: #0062a3;
    }

    .controls {
      padding: 10px;
      border-bottom: 1px solid #444;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
    }
  </style>
  <script>
    const go = new Go();
    let wasmReady = false;
    let currentFile = null;

    WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((result) => {
      go.run(result.instance);
      console.log("Wasm initialized");
      wasmReady = true;
      document.querySelectorAll("button").forEach(b => b.disabled = false);
      refreshFileTree();
    });

    function refreshFileTree(path = ".") {
      const treeContainer = document.getElementById("file-tree");
      const entriesJson = readDir(path);
      if (entriesJson.startsWith("Error")) {
        console.error(entriesJson);
        return;
      }

      const entries = JSON.parse(entriesJson);
      treeContainer.innerHTML = "";

      // For now, flat view for simplicity, but we can make it recursive
      entries.sort((a, b) => (b.isDir - a.isDir) || a.name.localeCompare(b.name)).forEach(entry => {
        const div = document.createElement("div");
        const fullPath = path === "." ? entry.name : path + "/" + entry.name;
        div.className = "tree-item " + (entry.isDir ? "tree-folder" : "tree-file");
        if (currentFile === fullPath) div.classList.add("selected");
        div.textContent = (entry.isDir ? "📁 " : "📄 ") + entry.name;
        div.onclick = () => {
          if (!entry.isDir) {
            selectFile(fullPath);
            document.querySelectorAll(".tree-item").forEach(i => i.classList.remove("selected"));
            div.classList.add("selected");
          } else {
            refreshFileTree(fullPath);
          }
        };
        treeContainer.appendChild(div);
      });

      if (path !== ".") {
        const back = document.createElement("div");
        back.className = "tree-item tree-folder";
        back.textContent = "⬅️ ..";
        back.onclick = () => {
          const parent = path.includes("/") ? path.substring(0, path.lastIndexOf("/")) : ".";
          refreshFileTree(parent);
        };
        treeContainer.prepend(back);
      }
    }

    function selectFile(path) {
      currentFile = path;
      const content = readFile(path);
      document.getElementById("editor").value = content;
      document.getElementById("current-tab").textContent = path;
    }

    function saveCurrentFile() {
      if (!currentFile) return;
      const content = document.getElementById("editor").value;
      updateFile(currentFile, content);
    }

    async function createNewProject() {
      mkdir("myproject");
      updateFile("myproject/Ballerina.toml", '[package]\norg = "test"\nname = "myproject"\nversion = "0.1.0"\n');
      updateFile("myproject/main.bal", 'import ballerina/io;\n\npublic function main() {\n    io:println("Hello from myproject!");\n}\n');
      refreshFileTree("myproject");
      selectFile("myproject/main.bal");
    }

    function runCode() {
      if (!wasmReady) return;
      saveCurrentFile();

      const outputDiv = document.getElementById("output-panel");
      outputDiv.textContent = "> Executing...\n";

      // Capture console.log
      const oldLog = console.log;
      console.log = function (...args) {
        outputDiv.textContent += args.join(" ") + "\n";
        outputDiv.scrollTop = outputDiv.scrollHeight;
        oldLog.apply(console, args);
      };

      try {
        // If currentFile is inside a project, run the project dir, otherwise run the file
        const runPath = currentFile.includes("/") ? currentFile.substring(0, currentFile.indexOf("/")) : currentFile;
        const result = runProject(runPath);
        outputDiv.textContent += "\n--- Result ---\n" + result + "\n";
      } catch (e) {
        outputDiv.textContent += "\n--- Error ---\n" + e.message + "\n";
      } finally {
        console.log = oldLog;
      }
    }
  </script>
</head>

<body>
  <header>
    <div>Ballerina Wasm IDE</div>
    <div>
      <button onclick="createNewProject()" disabled>New Project</button>
      <button id="runBtn" onclick="runCode()" disabled style="background: #28a745;">Run</button>
    </div>
  </header>
  <main>
    <div id="sidebar">
      <div class="controls">EXPLORER</div>
      <div id="file-tree"></div>
    </div>
    <div id="editor-container">
      <div id="tabs">
        <div id="current-tab" class="tab active">No file selected</div>
      </div>
      <textarea id="editor" spellcheck="false" placeholder="Select a file from the sidebar to edit..."></textarea>
      <div id="output-panel">Output will appear here...</div>
    </div>
  </main>
</body>

</html>
