name: PR Benchmark

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    name: Benchmark main vs PR head
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Install hyperfine
        run: |
          sudo apt-get update
          sudo apt-get install -y hyperfine

      - name: Build benchmark tool
        working-directory: compiler-tools/benchmark
        run: go build -o ../../bin/benchmark .

      - name: Run benchmark and export HTML
        run: |
          ./bin/benchmark \
            --runs 10 \
            --warmup 2 \
            --export-html compiler-tools/benchmark/output.html \
            origin/main \
            HEAD \
            corpus/bal/subset6/06-bench

      - name: Update benchmark comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- benchmark-pr-comment -->";
            const html = fs.readFileSync("compiler-tools/benchmark/output.html", "utf8");
            const tableMatch = html.match(/<table\b[\s\S]*?<\/table>/i);
            if (!tableMatch) {
              core.setFailed("No <table>...</table> found in benchmark output");
              return;
            }
            const cleanTable = tableMatch[0]
              .replace(/\sclass="[^"]*"/g, "")
              .replace(/<\/?span\b[^>]*>/g, "")
              .split("\n")
              .map((line) => line.trimStart())
              .join("\n")
              .trim();
            const body = [
              marker,
              "## Benchmark Results",
              "",
              cleanTable,
              "",
              "_Generated by benchmark workflow for `origin/main` vs `HEAD`._"
            ].join("\n");
            const issueNumber = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100
            });

            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
              core.info(`Updated benchmark comment: ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body
              });
              core.info("Created benchmark comment");
            }
